# Include inside nginx.conf's http {} (e.g. /etc/nginx/conf.d/uu-english.conf).
# HTTPS terminates at the existing Ingress / CLB; this is its internal upstream.
server {
    listen 0.0.0.0:8080;
    server_name uu-english.test.example.com;
    root /srv/uu-english/current;
    index index.html;
    server_tokens off;
    autoindex off;
    # current is an operator-controlled release symlink; disallow links beneath it.
    disable_symlinks on from=$document_root;
    sendfile on;
    etag on;
    max_ranges 1;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        audio/mpeg mp3;
        audio/wav wav;
        text/plain txt md;
    }
    default_type application/octet-stream;
    # Stable audio names can be replaced, so never mark them immutable.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    # Do not add location-level add_header directives: they would replace these.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /__health { default_type application/json; return 200 '{"service":"uu-english","build":"1.0.0"}'; }
    # No Python collector is deployed, and no diagnostic endpoint is proxied.
    location ^~ /__ { return 403; }
    location ~ (^|/)\. { return 404; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /sw.js { try_files $uri =404; }
    location = /offline-assets.json { try_files $uri =404; }
    location = /docs/WORD-IPA-CREDITS.txt { try_files $uri =404; }
    location = /docs/PHONICS-CREDITS.md { try_files $uri =404; }
    location = /audio/metadata/CHILD-VOICE-CREDITS.txt { try_files $uri =404; }
    location = /audio/metadata/PHONEME-CREDITS.txt { try_files $uri =404; }
    location ~ ^/(src|data)/[a-zA-Z0-9/_-]+\.js$ { try_files $uri =404; }
    location ~ ^/styles/[a-zA-Z0-9/_-]+\.css$ { try_files $uri =404; }
    location ~ ^/audio/(?!metadata/)[a-z][a-z0-9-]*/(letters|words|phonemes|phonics|sentences|scenes|stories|shared)/[a-zA-Z0-9._-]+\.(wav|mp3)$ { try_files $uri =404; }
    location / { return 404; }
}
